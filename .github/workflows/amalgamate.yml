#
# Regenerates the amalgamated single header in extra/single_include/ whenever
# the real headers change on develop, and commits the result back.
# The paths filter below does not include extra/single_include/, and the bot
# commit carries [skip ci], so the push-back cannot retrigger this workflow
# or the main CI.

name: amalgamate

on:
  workflow_dispatch:
  push:
    branches:
      - develop
    paths:
      - 'include/**'
      - 'extra/amalgamate.py'
      - '.github/workflows/amalgamate.yml'

concurrency:
  group: ${{format('{0}:amalgamate', github.repository)}}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Regenerate the single header
        run: python3 extra/amalgamate.py

      # The single header still needs these Boost libraries, as on Compiler Explorer.
      # Released (master) versions are used so the smoke test matches what users get.
      - name: Fetch the external Boost dependencies
        run: |
          for lib in assert charconv config core static_assert throw_exception; do
            git clone --depth 1 --branch master --quiet "https://github.com/boostorg/${lib}.git" "${RUNNER_TEMP}/deps/${lib}"
          done

      - name: Smoke test the single header
        run: |
          cat > "${RUNNER_TEMP}/smoke.cpp" << 'EOF'
          // Smoke test for the amalgamated single header. Verifies the header is
          // self-contained apart from its Boost dependencies and core operations work end to end.

          #include <boost/safe_numbers.hpp>
          #include <iostream>
          #include <limits>
          #include <sstream>
          #include <stdexcept>

          int main()
          {
              using namespace boost::safe_numbers;

              const u32 a {4'000'000'000U};
              const u32 b {500'000'000U};

              bool caught {false};
              try
              {
                  const u32 c {a + b};
                  static_cast<void>(c);
              }
              catch (const std::overflow_error&)
              {
                  caught = true;
              }

              if (!caught)
              {
                  return 1;
              }

              if (sat_u32{4'000'000'000U} + sat_u32{500'000'000U} != (std::numeric_limits<sat_u32>::max)())
              {
                  return 2;
              }

              const auto big {u128{1U} << u128{100U}};
              std::ostringstream os {};
              os << big;
              if (os.str() != "1267650600228229401496703205376")
              {
                  return 3;
              }

              if (i128{-7} * i128{6} != i128{-42})
              {
                  return 4;
              }

              caught = false;
              try
              {
                  const bounded_uint<0U, 100U> percent {101U};
                  static_cast<void>(percent);
              }
              catch (const std::exception&)
              {
                  caught = true;
              }

              if (!caught)
              {
                  return 5;
              }

              std::cout << "Single header smoke test passed" << std::endl;
              return 0;
          }
          EOF
          deps=()
          for lib in "${RUNNER_TEMP}"/deps/*; do
            deps+=(-I "${lib}/include")
          done
          for std in c++20 c++23; do
            g++ -std=${std} -Wall -Wextra -I extra/single_include "${deps[@]}" "${RUNNER_TEMP}/smoke.cpp" -o "${RUNNER_TEMP}/smoke"
            "${RUNNER_TEMP}/smoke"
          done

      - name: Commit and push if changed
        run: |
          git add extra/single_include
          if git diff --cached --quiet; then
            echo 'Single header is already up to date'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "Regenerate amalgamated single header from ${GITHUB_SHA} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
